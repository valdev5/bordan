<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mon travail — Intervenant</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0ea5e9">
</head>
<body>
  <header class="topbar">
    <h1>Mon travail</h1>
    <div class="auth-inline">
      <span id="whoami" class="muted"></span>
      <button class="btn" id="btn-install" type="button" style="display:none;">Installer l'appli</button>
      <button class="btn" id="btn-push" type="button">Activer les notifications</button>
      <a class="btn outline" href="#" id="btn-logout">Se déconnecter</a>
    </div>
    <nav class="tabs">
      <button class="tab active" data-tab="travail">Mon travail</button>
      <button class="tab" data-tab="messagerie">Messagerie<span class="tab-badge" id="messagerie-tab-badge" style="display:none"></span></button>
    </nav>
  </header>

  <main class="container">
    <section class="view show" id="tab-travail">
      <div class="sheet" style="margin-bottom:16px">
        <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px">
          <h2 class="title" style="margin:0">Planning de la semaine</h2>
          <div style="display:flex; align-items:center; gap:8px">
            <button type="button" class="btn outline" id="planning-prev" aria-label="Semaine precedente">‹</button>
            <span class="small muted" id="planning-range"></span>
            <button type="button" class="btn outline" id="planning-next" aria-label="Semaine suivante">›</button>
          </div>
        </div>
        <div class="planning-grid" id="planning-grid"></div>
      </div>

      <div class="sheet">
        <h2 class="title">Mes chantiers</h2>
        <div id="work-empty" class="tips" style="display:none">Aucun bon ne t’est affecté pour le moment.</div>
        <div id="work-list" class="work-list"></div>
      </div>
    </section>

    <section class="view" id="tab-messagerie">
      <div class="messenger">
        <div class="thread-list">
          <div class="thread-list-head">
            <h2>Chantiers</h2>
            <input type="text" id="msg-search" class="thread-search" placeholder="Rechercher un client ou un numéro…">
          </div>
          <div class="threads" id="msg-threads"></div>
        </div>

        <div class="conversation">
          <div class="conv-head">
            <div>
              <h2 id="msg-conv-title">—</h2>
              <div class="small" id="msg-conv-sub">—</div>
            </div>
            <a href="#" class="conv-head-link" id="msg-conv-open">Voir le chantier ↗</a>
          </div>
          <div class="conv-body" id="msg-conv-body"></div>
          <div class="conv-form">
            <input type="text" id="msg-compose-input" placeholder="Écrire un message…">
            <button type="button" class="btn primary" id="msg-compose-send">Envoyer</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script src="app-common.js"></script>
  <script src="worker.js"></script>
</body>
</html>
