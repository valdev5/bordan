<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connexion</title>
  <link rel="icon" href="data:;base64,=">
  <link rel="stylesheet" href="login.css">
  <link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0ea5e9">
</head>
<body>
  <div class="fx-halo"></div>

  <svg class="fx-scene" viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#060a10"/>
        <stop offset="55%" stop-color="#0a141e"/>
        <stop offset="100%" stop-color="#0f1e2c"/>
      </linearGradient>
      <clipPath id="shutterClip1">
        <rect x="6" y="60" width="26" height="34" rx=".8"/>
      </clipPath>
      <clipPath id="shutterClip2">
        <rect x="100" y="62" width="28" height="32" rx=".8"/>
      </clipPath>
    </defs>

    <rect x="-10" y="-10" width="180" height="120" fill="url(#sky)"/>

    <circle class="star" cx="14" cy="10" r=".35" style="animation-delay:-1s"/>
    <circle class="star" cx="40" cy="6" r=".3" style="animation-delay:-2.4s"/>
    <circle class="star" cx="70" cy="14" r=".4" style="animation-delay:-.6s"/>
    <circle class="star" cx="112" cy="8" r=".3" style="animation-delay:-3.1s"/>
    <circle class="star" cx="138" cy="16" r=".35" style="animation-delay:-1.8s"/>
    <circle class="star" cx="150" cy="9" r=".3" style="animation-delay:-2.9s"/>

    <ellipse class="cloud c1" cx="30" cy="16" rx="18" ry="3.4"/>
    <ellipse class="cloud c2" cx="95" cy="10" rx="22" ry="3"/>
    <ellipse class="cloud c3" cx="140" cy="20" rx="16" ry="2.6"/>

    <!-- Bloc gauche (entrepot avec 1er rideau) -->
    <rect class="block" x="-10" y="40" width="72" height="60" rx="1"/>
    <path class="roofline" d="M-10,40 L62,40 L62,30 L10,30"/>
    <rect class="block-front" x="-4" y="46" width="18" height="8" rx=".6" opacity=".7"/>

    <rect class="shutter" x="6" y="60" width="26" height="34" rx=".8"/>
    <g class="shutter-lines" clip-path="url(#shutterClip1)">
      <line x1="4" y1="61.5" x2="34" y2="61.5"/>
      <line x1="4" y1="64" x2="34" y2="64"/>
      <line x1="4" y1="66.5" x2="34" y2="66.5"/>
      <line x1="4" y1="69" x2="34" y2="69"/>
      <line x1="4" y1="71.5" x2="34" y2="71.5"/>
      <line x1="4" y1="74" x2="34" y2="74"/>
      <line x1="4" y1="76.5" x2="34" y2="76.5"/>
      <line x1="4" y1="79" x2="34" y2="79"/>
      <line x1="4" y1="81.5" x2="34" y2="81.5"/>
      <line x1="4" y1="84" x2="34" y2="84"/>
      <line x1="4" y1="86.5" x2="34" y2="86.5"/>
      <line x1="4" y1="89" x2="34" y2="89"/>
      <line x1="4" y1="91.5" x2="34" y2="91.5"/>
    </g>
    <g clip-path="url(#shutterClip1)">
      <rect class="sheen sheen-mask-rect" x="-14" y="58" width="8" height="38" transform="skewX(-18)"/>
    </g>

    <!-- Bloc droit (accueil, enseigne, 2e rideau) -->
    <rect class="block" x="55" y="48" width="105" height="52" rx="1"/>
    <path class="roofline" d="M55,48 L92,48 L92,38 L160,38"/>

    <rect class="awning" x="90" y="55" width="46" height="4.4" rx=".5"/>
    <rect class="awning-edge" x="90" y="58.6" width="46" height="1" />

    <line class="sign-pole" x1="80" y1="16" x2="80" y2="48"/>
    <rect class="sign-box" x="53" y="4" width="54" height="12" rx="1.4"/>
    <text class="sign-text" x="80" y="10">BORDANOVA</text>

    <rect class="shutter" x="100" y="62" width="28" height="32" rx=".8"/>
    <g class="shutter-lines" clip-path="url(#shutterClip2)">
      <line x1="98" y1="63.5" x2="130" y2="63.5"/>
      <line x1="98" y1="66" x2="130" y2="66"/>
      <line x1="98" y1="68.5" x2="130" y2="68.5"/>
      <line x1="98" y1="71" x2="130" y2="71"/>
      <line x1="98" y1="73.5" x2="130" y2="73.5"/>
      <line x1="98" y1="76" x2="130" y2="76"/>
      <line x1="98" y1="78.5" x2="130" y2="78.5"/>
      <line x1="98" y1="81" x2="130" y2="81"/>
      <line x1="98" y1="83.5" x2="130" y2="83.5"/>
      <line x1="98" y1="86" x2="130" y2="86"/>
      <line x1="98" y1="88.5" x2="130" y2="88.5"/>
      <line x1="98" y1="91" x2="130" y2="91"/>
      <line x1="98" y1="93.5" x2="130" y2="93.5"/>
    </g>
    <g clip-path="url(#shutterClip2)">
      <rect class="sheen sheen-mask-rect" x="60" y="60" width="8" height="36" transform="skewX(-18)" style="animation-delay:-2s"/>
    </g>

    <!-- petites fenetres etage -->
    <rect x="102" y="42" width="7" height="4" rx=".3" fill="#1c2b3b" stroke="#2a3d51" stroke-width=".25"/>
    <rect x="112" y="42" width="7" height="4" rx=".3" fill="#1c2b3b" stroke="#2a3d51" stroke-width=".25"/>

    <!-- sol / parking -->
    <rect class="ground" x="-10" y="94" width="180" height="16" />
    <path class="lane" d="M4,102 L-2,109"/>
    <path class="lane" d="M14,102 L8,109"/>
    <path class="lane" d="M24,102 L18,109"/>
    <path class="lane" d="M140,102 L134,109"/>
    <path class="lane" d="M150,102 L144,109"/>

    <!-- borne rouge/blanche comme sur la photo -->
    <rect class="bollard-red" x="1" y="90" width="1.6" height="10" rx=".6"/>
    <rect class="bollard-white" x="1" y="92.4" width="1.6" height="1.6"/>
    <rect class="bollard-white" x="1" y="96" width="1.6" height="1.6"/>
  </svg>

  <main class="login-wrap">
    <section class="card">
      <h1>Se connecter</h1>
      

      <div class="row">
        <label for="username">Utilisateur</label>
        <input id="username" autocomplete="username" />
      </div>

      <div class="row">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" autocomplete="current-password" />
      </div>

      <button id="btn-login" class="btn primary">Connexion</button>

     
    </section>
  </main>

  <!-- API d'abord, puis auth, puis la logique du login -->
  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script src="login.js"></script>
</body>
</html>
