<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connexion</title>
  <link rel="icon" href="data:;base64,=">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
  <link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0ea5e9">
</head>
<body>
  <div class="fx-halo"></div>

  <svg class="fx-scene" viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#060a10"/>
        <stop offset="55%" stop-color="#0a141e"/>
        <stop offset="100%" stop-color="#0f1e2c"/>
      </linearGradient>
      <clipPath id="shutterClip1">
        <rect x="2" y="60" width="22" height="34" rx=".8"/>
      </clipPath>
      <clipPath id="shutterClip2">
        <rect x="30" y="60" width="22" height="34" rx=".8"/>
      </clipPath>
      <clipPath id="shutterClip3">
        <rect x="112" y="64" width="24" height="28" rx=".8"/>
      </clipPath>
    </defs>

    <rect x="-10" y="-10" width="180" height="120" fill="url(#sky)"/>

    <circle class="star" cx="14" cy="10" r=".35" style="animation-delay:-1s"/>
    <circle class="star" cx="40" cy="6" r=".3" style="animation-delay:-2.4s"/>
    <circle class="star" cx="70" cy="14" r=".4" style="animation-delay:-.6s"/>
    <circle class="star" cx="112" cy="8" r=".3" style="animation-delay:-3.1s"/>
    <circle class="star" cx="138" cy="16" r=".35" style="animation-delay:-1.8s"/>
    <circle class="star" cx="150" cy="9" r=".3" style="animation-delay:-2.9s"/>

    <ellipse class="cloud c1" cx="30" cy="16" rx="18" ry="3.4"/>
    <ellipse class="cloud c2" cx="95" cy="10" rx="22" ry="3"/>
    <ellipse class="cloud c3" cx="140" cy="20" rx="16" ry="2.6"/>

    <!-- Bloc gauche (entrepot, 2 rideaux cote a cote) -->
    <rect class="block" x="-10" y="36" width="86" height="64" rx="1"/>
    <path class="roofline" d="M-10,36 L18,36 L18,24 L46,24 L46,36"/>
    <rect class="block-front" x="34" y="40" width="8" height="6" rx=".5" opacity=".7"/>

    <rect class="shutter" x="2" y="60" width="22" height="34" rx=".8"/>
    <g class="shutter-lines" clip-path="url(#shutterClip1)">
      <line x1="0" y1="61.5" x2="26" y2="61.5"/>
      <line x1="0" y1="64" x2="26" y2="64"/>
      <line x1="0" y1="66.5" x2="26" y2="66.5"/>
      <line x1="0" y1="69" x2="26" y2="69"/>
      <line x1="0" y1="71.5" x2="26" y2="71.5"/>
      <line x1="0" y1="74" x2="26" y2="74"/>
      <line x1="0" y1="76.5" x2="26" y2="76.5"/>
      <line x1="0" y1="79" x2="26" y2="79"/>
      <line x1="0" y1="81.5" x2="26" y2="81.5"/>
      <line x1="0" y1="84" x2="26" y2="84"/>
      <line x1="0" y1="86.5" x2="26" y2="86.5"/>
      <line x1="0" y1="89" x2="26" y2="89"/>
      <line x1="0" y1="91.5" x2="26" y2="91.5"/>
    </g>
    <g clip-path="url(#shutterClip1)">
      <rect class="sheen sheen-mask-rect" x="-18" y="58" width="8" height="38" transform="skewX(-18)"/>
    </g>

    <rect class="shutter" x="30" y="60" width="22" height="34" rx=".8"/>
    <g class="shutter-lines" clip-path="url(#shutterClip2)">
      <line x1="28" y1="61.5" x2="54" y2="61.5"/>
      <line x1="28" y1="64" x2="54" y2="64"/>
      <line x1="28" y1="66.5" x2="54" y2="66.5"/>
      <line x1="28" y1="69" x2="54" y2="69"/>
      <line x1="28" y1="71.5" x2="54" y2="71.5"/>
      <line x1="28" y1="74" x2="54" y2="74"/>
      <line x1="28" y1="76.5" x2="54" y2="76.5"/>
      <line x1="28" y1="79" x2="54" y2="79"/>
      <line x1="28" y1="81.5" x2="54" y2="81.5"/>
      <line x1="28" y1="84" x2="54" y2="84"/>
      <line x1="28" y1="86.5" x2="54" y2="86.5"/>
      <line x1="28" y1="89" x2="54" y2="89"/>
      <line x1="28" y1="91.5" x2="54" y2="91.5"/>
    </g>
    <g clip-path="url(#shutterClip2)">
      <rect class="sheen sheen-mask-rect" x="10" y="58" width="8" height="38" transform="skewX(-18)" style="animation-delay:-2.4s"/>
    </g>

    <!-- Bloc droit (showroom, enseigne secondaire, hublot) -->
    <rect class="block" x="70" y="52" width="100" height="48" rx="1"/>
    <path class="roofline" d="M70,52 L100,52 L100,44 L170,44"/>
    <circle class="porthole" cx="100" cy="48" r="3"/>

    <rect class="awning" x="104" y="58" width="50" height="4.4" rx=".5"/>
    <rect class="awning-edge" x="104" y="61.6" width="50" height="1"/>
    <rect class="accent-warm" x="108" y="54" width="32" height="3" rx=".6"/>

    <rect class="shutter" x="112" y="64" width="24" height="28" rx=".8"/>
    <g class="shutter-lines" clip-path="url(#shutterClip3)">
      <line x1="110" y1="65.4" x2="138" y2="65.4"/>
      <line x1="110" y1="67.8" x2="138" y2="67.8"/>
      <line x1="110" y1="70.2" x2="138" y2="70.2"/>
      <line x1="110" y1="72.6" x2="138" y2="72.6"/>
      <line x1="110" y1="75" x2="138" y2="75"/>
      <line x1="110" y1="77.4" x2="138" y2="77.4"/>
      <line x1="110" y1="79.8" x2="138" y2="79.8"/>
      <line x1="110" y1="82.2" x2="138" y2="82.2"/>
      <line x1="110" y1="84.6" x2="138" y2="84.6"/>
      <line x1="110" y1="87" x2="138" y2="87"/>
      <line x1="110" y1="89.4" x2="138" y2="89.4"/>
      <line x1="110" y1="91.8" x2="138" y2="91.8"/>
    </g>

    <rect class="shopwindow" x="144" y="62" width="12" height="20" rx=".6"/>

    <!-- enseigne principale, centree pour rester visible quel que soit l'ecran -->
    <line class="sign-pole" x1="80" y1="30" x2="80" y2="36"/>
    <rect class="sign-box" x="57" y="20" width="46" height="10" rx="1.4"/>
    <image class="sign-logo" href="logo-transparent.png" x="61" y="21" width="8" height="8"/>
    <text class="sign-text" x="70.5" y="25.4" text-anchor="start"><tspan class="t-borda">Borda</tspan><tspan class="t-nova">nova</tspan></text>
    <text class="sign-highlight" x="70.5" y="25.4" text-anchor="start" aria-hidden="true">Bordanova</text>

    <!-- arbre -->
    <g class="tree">
      <rect class="trunk" x="157" y="33" width="2" height="7"/>
      <circle cx="158" cy="27" r="7"/>
      <circle cx="152" cy="24" r="5"/>
      <circle cx="164" cy="25" r="5.5"/>
    </g>

    <!-- sol / parking -->
    <rect class="ground" x="-10" y="94" width="180" height="16" />
    <path class="lane" d="M4,102 L-2,109"/>
    <path class="lane" d="M14,102 L8,109"/>
    <path class="lane" d="M24,102 L18,109"/>
    <path class="lane" d="M140,102 L134,109"/>
    <path class="lane" d="M150,102 L144,109"/>

    <!-- voitures garees -->
    <rect class="car car-red" x="19" y="86" width="15" height="6.4" rx="1.8"/>
    <rect class="car car-red" x="23" y="82.4" width="8" height="4.4" rx="1.4"/>
    <rect class="car car-light" x="38" y="86" width="15" height="6.4" rx="1.8"/>
    <rect class="car car-light" x="42" y="82.4" width="8" height="4.4" rx="1.4"/>

    <!-- borne rouge/blanche comme sur la photo -->
    <rect class="bollard-red" x="1" y="90" width="1.6" height="10" rx=".6"/>
    <rect class="bollard-white" x="1" y="92.4" width="1.6" height="1.6"/>
    <rect class="bollard-white" x="1" y="96" width="1.6" height="1.6"/>
  </svg>

  <main class="login-wrap">
    <section class="card">
      <h1>Se connecter</h1>
      

      <div class="row">
        <label for="username">Utilisateur</label>
        <input id="username" autocomplete="username" />
      </div>

      <div class="row">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" autocomplete="current-password" />
      </div>

      <button id="btn-login" class="btn primary">Connexion</button>

     
    </section>
  </main>

  <!-- API d'abord, puis auth, puis la logique du login -->
  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script src="login.js"></script>
</body>
</html>
