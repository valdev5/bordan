<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="icon" href="data:;base64,=">

</head>
<body>
  <svg class="fx-blueprint" viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <path class="duct-wide" d="M-10,26 L40,26 L40,50 L118,50 L118,20 L170,20" />
    <path class="duct" d="M-10,26 L40,26 L40,50 L118,50 L118,20 L170,20" />
    <path class="trace" d="M-10,26 L40,26 L40,50 L118,50 L118,20 L170,20" />

    <path class="duct-wide" d="M-10,78 L32,78 L32,62 L80,62 L80,92 L170,92" />
    <path class="duct" d="M-10,78 L32,78 L32,62 L80,62 L80,92 L170,92" />
    <path class="trace d2" d="M-10,78 L32,78 L32,62 L80,62 L80,92 L170,92" />

    <path class="duct-wide" d="M22,-10 L22,14 L66,14 L66,66 L92,66 L92,110" />
    <path class="duct" d="M22,-10 L22,14 L66,14 L66,66 L92,66 L92,110" />
    <path class="trace d3" d="M22,-10 L22,14 L66,14 L66,66 L92,66 L92,110" />

    <circle class="node" cx="40" cy="26" r="1" />
    <circle class="node" cx="40" cy="50" r="1" />
    <circle class="node" cx="118" cy="50" r="1" />
    <circle class="node" cx="118" cy="20" r="1" />
    <circle class="node" cx="32" cy="78" r="1" />
    <circle class="node" cx="32" cy="62" r="1" />
    <circle class="node" cx="80" cy="62" r="1" />
    <circle class="node" cx="80" cy="92" r="1" />
    <circle class="node" cx="22" cy="14" r="1" />
    <circle class="node" cx="66" cy="14" r="1" />
    <circle class="node" cx="66" cy="66" r="1" />
    <circle class="node" cx="92" cy="66" r="1" />
  </svg>

  <main class="login-wrap">
    <section class="card">
      <h1>Se connecter</h1>
      

      <div class="row">
        <label for="username">Utilisateur</label>
        <input id="username" autocomplete="username" />
      </div>

      <div class="row">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" autocomplete="current-password" />
      </div>

      <button id="btn-login" class="btn primary">Connexion</button>

     
    </section>
  </main>

  <!-- API d'abord, puis auth, puis la logique du login -->
  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script src="login.js"></script>
</body>
</html>
