<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Espace Comptabilité</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0ea5e9">
</head>
<body>
  <header class="topbar">
    <h1>Espace Comptabilité</h1>
    <div class="auth-inline">
      <span id="whoami" class="muted"></span>
      <div class="menu-dropdown">
        <button class="btn" id="btn-options" type="button">Options ▾</button>
        <div class="menu-dropdown-panel" id="options-panel">
          <button class="btn" id="btn-install" type="button" style="display:none;">Installer l'appli</button>
          <button class="btn" id="btn-push" type="button">Activer les notifications</button>
        </div>
      </div>
      <a class="btn outline" href="#" id="btn-logout">Se déconnecter</a>
    </div>
  </header>

  <div class="tabs" style="margin:14px 16px 0;">
    <button class="tab active" data-compta-tab="facturer">À facturer <span class="tab-badge" id="tab-badge-facturer" style="display:none;">0</span></button>
    <button class="tab" data-compta-tab="devis">Devis <span class="tab-badge" id="tab-badge-devis" style="display:none;">0</span></button>
    <button class="tab" data-compta-tab="nouveau">Nouveau devis</button>
  </div>

  <main class="container">
    <section class="view show" id="tab-compta-facturer">
      <div class="sheet">
        <h2 class="title">Bons « À facturer » qui me sont assignés</h2>

        <div id="compta-recap" class="work-meta" style="margin-bottom:14px;">
          <span class="badge" id="recap-count">0 bon en attente</span>
          <span class="badge" id="recap-hours">0 h au total</span>
          <button class="btn" id="btn-export-csv" type="button">Exporter en CSV</button>
        </div>

        <div id="compta-empty" class="tips" style="display:none;">Aucun bon en attente.</div>
        <div id="compta-list" class="work-list"></div>

        <hr style="margin:24px 0; opacity:.2">

        <h2 class="title">Archivés</h2>
        <div id="arch-empty" class="tips" style="display:none;">Aucun bon archivé.</div>
        <div id="arch-list" class="work-list"></div>
      </div>
    </section>

    <section class="view" id="tab-compta-devis">
      <div class="sheet">
        <h2 class="title">Devis qui me sont assignés</h2>

        <div id="devis-recap" class="work-meta" style="margin-bottom:14px;">
          <span class="badge" id="devis-recap-count">0 devis en attente</span>
        </div>

        <div id="devis-empty" class="tips" style="display:none;">Aucun devis en attente.</div>
        <div id="devis-list" class="work-list"></div>
      </div>
    </section>

    <section class="view" id="tab-compta-nouveau">
      <div class="sheet">
        <h2 class="title">Nouveau devis (appel téléphonique)</h2>

        <div class="grid-3">
          <div class="row"><label>Numéro de devis</label><input id="pd-num" type="text" placeholder="DV-YYYYMMDD-XXX"></div>
          <div class="row"><label>Date</label><input id="pd-date" type="date"></div>
          <div class="row"><label>N° client</label><input id="pd-numclient" type="text"></div>
        </div>

        <div class="grid-2">
          <div class="row"><label>Nom du client</label><input id="pd-nom" type="text"></div>
          <div class="row"><label>Téléphone</label><input id="pd-tel" type="tel"></div>
        </div>

        <div class="row"><label>Adresse</label><input id="pd-adresse" type="text"></div>

        <div class="grid-2">
          <div class="row"><label>Code postal</label><input id="pd-cp" type="text"></div>
          <div class="row"><label>Ville</label><input id="pd-ville" type="text"></div>
        </div>

        <div class="row"><label>Objet de la demande</label><input id="pd-objet" type="text"></div>
        <div class="row"><label>Notes avant RDV</label><textarea id="pd-notes" rows="3" placeholder="Infos à noter avant le rendez-vous…"></textarea></div>

        <div class="row"><label>Encadrant(s) à assigner</label>
          <div class="chips">
            <label><input type="checkbox" class="pd-enc-team" value="Laurent"><span>Laurent</span></label>
            <label><input type="checkbox" class="pd-enc-team" value="Cédric M"><span>Cédric M</span></label>
            <label><input type="checkbox" class="pd-enc-team" value="Cédric A"><span>Cédric A</span></label>
            <label><input type="checkbox" class="pd-enc-team" value="Vivien"><span>Vivien</span></label>
            <label><input type="checkbox" class="pd-enc-team" value="Karine"><span>Karine</span></label>
          </div>
        </div>

        <div class="actions" style="display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:8px">
          <button class="btn primary" id="save-phone-devis">Enregistrer le devis</button>
        </div>
      </div>
    </section>
  </main>

  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script src="app-common.js"></script>
  <script src="compta.js"></script>
</body>
</html>
